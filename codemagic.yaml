# Codemagic CI/CD configuration for Rtouch iOS build
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-test-sideload:
    name: iOS Test Build (No Firebase — Sideloadly compatible)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Rtouch-sideload.ipa Payload
    artifacts:
      - build/ios/ipa/Rtouch-sideload.ipa
    artifacts:
      - build/ios/ipa/Rtouch-test-sideload.ipa

  ios-unsigned:
    name: iOS Build (Unsigned — Simulator only)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/Rtouch-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app

  ios-signed:
    name: iOS Build (Signed — Ad Hoc / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: ad_hoc      # غيّرها إلى app_store للنشر على TestFlight
        bundle_identifier: com.rtouch.rtouch
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
