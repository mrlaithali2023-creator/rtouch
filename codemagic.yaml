# Codemagic CI/CD configuration for Rtouch iOS build
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-sideload:
    name: iOS Build (Unsigned IPA for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Strip signatures and package IPA
        script: |
          APP="build/ios/iphoneos/Runner.app"
          codesign --remove-signature "$APP" 2>/dev/null || true
          find "$APP/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) 2>/dev/null | while read f; do
            codesign --remove-signature "$f" 2>/dev/null || true
          done
          echo "=== Frameworks (must be <= 10 for free Apple ID signing) ==="
          ls -1 "$APP/Frameworks" 2>/dev/null | wc -l
          ls -1 "$APP/Frameworks" 2>/dev/null
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Rtouch.ipa Payload
    artifacts:
      - build/ios/ipa/Rtouch.ipa

  ios-signed:
    name: iOS Build (Signed — Ad Hoc / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.rtouch.rtouch
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
