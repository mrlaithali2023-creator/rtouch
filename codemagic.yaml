# Codemagic CI/CD configuration for Rtouch iOS build
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-test-sideload:
    name: iOS Test Build (No Push — Sideloadly compatible)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Strip Firebase from project
        script: |
          sed -i '' '/firebase_messaging/d' pubspec.yaml
          sed -i '' '/firebase_core/d' pubspec.yaml
          sed -i '' '/flutter_local_notifications/d' pubspec.yaml

          python3 - << 'EOF'
          import os

          main = """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'screens/home_screen.dart';
          import 'services/push_service.dart';
          import 'theme.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            await PushService.instance.init();
            runApp(const RtouchApp());
          }

          class RtouchApp extends StatelessWidget {
            const RtouchApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Rtouch',
                debugShowCheckedModeBanner: false,
                theme: buildAppTheme(),
                locale: const Locale('ar'),
                supportedLocales: const [Locale('ar'), Locale('en')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                home: const HomeScreen(),
              );
            }
          }
          """

          push = """import 'package:flutter/foundation.dart';
          Future<void> firebaseMessagingBackgroundHandler(dynamic m) async {}
          class PushService {
            PushService._();
            static final PushService instance = PushService._();
            Future<void> init() async { debugPrint('PushService: disabled'); }
          }
          """

          appdelegate = """import UIKit
          import Flutter

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          """

          import textwrap
          with open('lib/main.dart', 'w') as f:
            f.write(textwrap.dedent(main))
          with open('lib/services/push_service.dart', 'w') as f:
            f.write(textwrap.dedent(push))
          with open('ios/Runner/AppDelegate.swift', 'w') as f:
            f.write(textwrap.dedent(appdelegate))

          print("Files rewritten successfully")
          EOF

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :FirebaseAppDelegateProxyEnabled" ios/Runner/Info.plist 2>/dev/null || true

      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build iOS via xcodebuild
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/Runner.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive
      - name: Create IPA for Sideloadly
        script: |
          APP_PATH=$(find build/ios/Runner.xcarchive -name "Runner.app" | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Rtouch-test-sideload.ipa Payload
    artifacts:
      - build/ios/ipa/Rtouch-test-sideload.ipa

  ios-unsigned:
    name: iOS Build (Unsigned — Simulator only)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/Rtouch-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app

  ios-signed:
    name: iOS Build (Signed — Ad Hoc / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: ad_hoc      # غيّرها إلى app_store للنشر على TestFlight
        bundle_identifier: com.rtouch.rtouch
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
